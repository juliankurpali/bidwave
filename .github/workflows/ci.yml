name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'
          cache: maven
      - name: Unit tests
        run: mvn -B test
      - name: Package Lambda jar
        run: mvn -B package -DskipTests
